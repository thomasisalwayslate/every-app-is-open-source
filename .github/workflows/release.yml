name: Prepare Python release

# Deliberately manual. Pushing code or tags cannot start this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from main after verifying its matching reviewed version tag
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect candidates (no publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.8'
          enable-cache: false
      - name: Require approved main and its matching version tag for publication
        if: ${{ inputs.publish }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['REF_TYPE'] != 'branch' or os.environ['REF_NAME'] != 'main':
              raise SystemExit('Publish requires approved main; no upload was attempted.')
          tag = 'v' + version
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.run(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'],
                                  text=True, capture_output=True)
          if tagged.returncode or tagged.stdout.strip() != head:
              raise SystemExit('Publish requires ' + tag + ' to point to this exact main commit; no upload was attempted.')
          PYTHON
      - name: Build wheel and source archive
        run: uv build --python 3.13
      - name: Inspect distribution contents
        run: uv run --no-project --python 3.13 python scripts/check_distribution.py dist
      - name: Run all portable tests
        run: PYTHONPATH=src uv run --no-project --python 3.13 python -m unittest discover -s tests -v
      - name: Benchmark argument and path isolation regressions
        run: node --test tests/benchmark-scope.test.mjs
      - name: Test installed wheel without native runtimes
        run: |
          uv venv --python 3.13 /tmp/eaos-wheel-check
          uv pip install --python /tmp/eaos-wheel-check/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/eaos-wheel-check/bin/eaos --help
          /tmp/eaos-wheel-check/bin/eaos setup --help
      - name: Record candidate identity
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
          python3 -c 'import json, os; print(json.dumps({"commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}))' > BUILD-INFO.json
      - name: Keep the checked artifacts for the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-python-release
          retention-days: 7
          path: |
            dist/*
            SHA256SUMS
            BUILD-INFO.json

  publish:
    name: Publish to PyPI
    # Off by default; the build verifies main and a matching immutable version tag.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.8'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-python-release
      - name: Verify exact checked artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish through PyPI OIDC
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
