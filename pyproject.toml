[project]
name = "every-app-is-open-source"
version = "0.1.3"
description = "Ghidra-powered MCP server for AI agents to reverse engineer native binaries with traceable evidence"
keywords = ["ghidra", "mcp", "reverse-engineering", "binary-analysis", "static-analysis", "ai-agents", "pyghidra"]
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "thomasisalwayslate", email = "148886635+thomasisalwayslate@users.noreply.github.com" }]
readme = "README.md"
dependencies = ["pyghidra==3.1.0", "jpype1==1.5.2", "packaging==26.3"]

[project.scripts]
eaos = "eaos.cli:main"
every-app-is-open-source = "eaos.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eaos = ["distributions.json"]

[project.urls]
Homepage = "https://github.com/thomasisalwayslate/every-app-is-open-source"
Documentation = "https://github.com/thomasisalwayslate/every-app-is-open-source/blob/main/docs/SETUP.md"
Changelog = "https://github.com/thomasisalwayslate/every-app-is-open-source/blob/main/CHANGELOG.md"
Security = "https://github.com/thomasisalwayslate/every-app-is-open-source/security/policy"
