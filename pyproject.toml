[project]
name = "every-app-is-open-source"
version = "0.1.0"
description = "Small, evidence-linked reverse-engineering tools for agents"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "thomasisalwayslate", email = "148886635+thomasisalwayslate@users.noreply.github.com" }]
readme = "README.md"
dependencies = ["pyghidra==3.1.0", "jpype1==1.5.2", "packaging==26.3"]

[project.scripts]
eaos = "eaos.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eaos = ["distributions.json"]

[project.urls]
Homepage = "https://github.com/thomasisalwayslate/every-app-is-open-source"
